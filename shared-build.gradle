android {
    namespace 'com.ymid.wakeonlan'
    compileSdk 36

    signingConfigs {
        release {
            storeFile file(project.findProperty('UPLOAD_KEYSTORE_PATH') ?: " ")
            storePassword project.findProperty('KEYSTORE_PASSWORD') ?: ""
            keyAlias project.findProperty('KEY_ALIAS') ?: ""
            keyPassword project.findProperty('KEY_PASSWORD') ?: ""

            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    "$rootProject.projectDir/proguard-rules.pro"
        }
        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    "$rootProject.projectDir/proguard-rules.pro"
        }
    }

    defaultConfig {
        applicationId "com.ymid.wakeonlan"
        minSdk 24
        targetSdk 36
        versionName "1.9.8"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'com.google.guava:guava:33.1.0-android'
    implementation 'com.google.code.gson:gson:2.14.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.23.0'
}
