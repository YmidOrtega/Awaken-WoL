apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply from: "$rootProject.projectDir/shared-build.gradle"

android {
    defaultConfig {
        versionCode 112
    }
    buildFeatures {
        dataBinding true
    }
    packaging {
        resources {
            excludes += '/META-INF/versions/9/OSGI-INF/MANIFEST.MF'
            excludes += 'META-INF/LICENSE.md'
            excludes += 'META-INF/LICENSE-notice.md'
        }
    }
    buildToolsVersion '35.0.0'
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.navigation:navigation-fragment:2.9.8'
    implementation 'androidx.navigation:navigation-ui:2.9.8'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'org.reactivestreams:reactive-streams:1.0.4'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.biometric:biometric:1.1.0'

    implementation 'androidx.core:core:1.18.0'
    implementation 'androidx.core:core-google-shortcuts:1.1.0'

    implementation 'androidx.preference:preference-ktx:1.2.1'

    def room_version = '2.8.4'
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    implementation "net.zetetic:sqlcipher-android:4.15.0"
    implementation 'androidx.sqlite:sqlite-ktx:2.6.2'
    implementation 'androidx.security:security-crypto:1.1.0'

    implementation 'com.hierynomus:sshj:0.40.0'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.84'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.84'

    implementation 'androidx.work:work-runtime-ktx:2.10.1'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    implementation 'com.google.android.play:review-ktx:2.0.2'

    implementation project(path: ':ping')

    implementation(platform('org.jetbrains.kotlin:kotlin-bom:2.3.21'))

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'

    // Firebase Crashlytics — add google-services.json to app/ to activate
    // buildscript classpath: 'com.google.firebase:firebase-crashlytics-gradle:3.0.2'
    //                        'com.google.gms:google-services:4.4.2'
    // apply plugin: 'com.google.gms.google-services'
    // apply plugin: 'com.google.firebase.crashlytics'
    // implementation platform('com.google.firebase:firebase-bom:33.7.0')
    // implementation 'com.google.firebase:firebase-crashlytics-ktx'
    // implementation 'com.google.firebase:firebase-analytics-ktx'
}
